<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WhatsApp</title>
    <style>
        * { box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; margin: 0; padding: 0; background: #111b21; color: #111b21; min-height: 100vh; }
        .container { max-width: 520px; margin: 0 auto; min-height: 100vh; background: #efeae2; display: flex; flex-direction: column; }
        header { background: #008069; color: #fff; padding: 10px 12px; display: flex; align-items: center; gap: 10px; position: sticky; top: 0; z-index: 10; }
        .back { font-size: 26px; line-height: 1; color: #fff; }
        .avatar { width: 40px; height: 40px; border-radius: 50%; background: #d9fdd3; color: #008069; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 15px; flex-shrink: 0; }
        .chat-name { flex: 1; min-width: 0; }
        .chat-name b { display: block; font-size: 16px; font-weight: 600; }
        .status { font-size: 12px; color: rgba(255,255,255,0.85); }
        .status.ok { color: #d9fdd3; }
        .status.bad { color: #ffb4a2; }
        .header-icons { font-size: 18px; letter-spacing: 10px; color: rgba(255,255,255,0.9); }
        .chat { flex: 1; padding: 14px 14px 8px; }
        .date-chip { text-align: center; margin-bottom: 14px; }
        .date-chip span { background: #fff; color: #667781; font-size: 12px; padding: 6px 12px; border-radius: 8px; box-shadow: 0 1px 1px rgba(0,0,0,0.08); }
        .bubble { max-width: 75%; padding: 8px 10px 6px; border-radius: 8px; font-size: 14px; line-height: 1.4; margin-bottom: 8px; box-shadow: 0 1px 1px rgba(0,0,0,0.08); position: relative; }
        .bubble .time { float: right; font-size: 11px; color: #8696a0; margin: 8px 0 0 8px; }
        .bubble.in { background: #fff; }
        .bubble.out { background: #d9fdd3; margin-left: auto; }
        .stickers { padding: 6px 14px 4px; }
        .stickers p { font-size: 12px; color: #667781; margin: 4px 0 8px 0; }
        .sticker-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
        .ad-option { display: block; padding: 12px 6px 10px; border: 1px solid #e9edef; border-radius: 12px; cursor: pointer; background: #fff; text-align: center; }
        .ad-option.selected { border-color: #00a884; background: #f0fbf7; box-shadow: 0 0 0 1px #00a884; }
        .ad-option input { display: none; }
        .ad-option .emoji { font-size: 28px; display: block; }
        .ad-option b { color: #111b21; display: block; font-size: 13px; font-weight: 600; margin-top: 4px; }
        .ad-option span span { font-size: 10px; color: #8696a0; word-break: break-all; display: block; line-height: 1.3; margin-top: 2px; }
        .input-bar { display: flex; align-items: center; gap: 8px; padding: 10px 12px 12px; background: #efeae2; position: sticky; bottom: 0; }
        .input-box { flex: 1; display: flex; align-items: center; gap: 8px; background: #fff; border-radius: 24px; padding: 8px 12px; box-shadow: 0 1px 2px rgba(0,0,0,0.08); }
        .input-box .icon { font-size: 20px; color: #8696a0; }
        input[type="text"], input[type="password"] { width: 100%; padding: 6px 2px; background: #fff; color: #111b21; border: none; border-radius: 8px; font-size: 15px; }
        input:focus { outline: none; }
        button { cursor: pointer; }
        .btn-push { width: 48px; height: 48px; flex-shrink: 0; padding: 0; border: none; border-radius: 50%; background: #00a884; color: #fff; font-size: 20px; }
        .btn-hide { background: none; border: none; color: #667781; font-size: 13px; padding: 4px 0 12px; }
        .btn-hide:hover { color: #111b21; }
        button:disabled { opacity: 0.5; }
        details { background: #fff; border-top: 1px solid #e9edef; }
        details summary { list-style: none; cursor: pointer; padding: 14px 16px; font-size: 14px; font-weight: 600; color: #111b21; display: flex; justify-content: space-between; align-items: center; }
        details summary::-webkit-details-marker { display: none; }
        details summary::after { content: "+"; font-size: 20px; font-weight: 400; color: #8696a0; }
        details[open ] summary::after { content: "−"; }
        details .details-body { padding: 0 16px 16px 16px; }
        details label { display: block; font-size: 13px; font-weight: 500; color: #374151; margin: 12px 0 6px 0; }
        details input[type="text"], details input[type="password"] { border: 1px solid #d1d5db; padding: 11px 12px; font-size: 14px; }
        details input:focus { border-color: #00a884; box-shadow: 0 0 0 3px rgba(0,168,132,0.15); }
        details .btn-save { width: 100%; padding: 12px; border: none; border-radius: 8px; font-size: 15px; font-weight: 600; background: #00a884; color: #fff; margin-top: 12px; }
        .note { font-size: 12px; color: #8696a0; line-height: 1.6; margin: 12px 0 0 0; }
    </style>
</head>
<body>
<div class="container">
    <header>
        <span class="back">‹</span>
        <span class="avatar">MN</span>
        <div class="chat-name">
            <b>Movie Night</b>
            <div class="status" id="status">connecting…</div>
        </div>
        <span class="header-icons">📹&nbsp;📞&nbsp;⋮</span>
    </header>

    <div class="chat">
        <div class="date-chip"><span>Today</span></div>
        <div class="bubble in">Movie starting in 5 min 🍿<span class="time">9:41 pm</span></div>
        <div class="bubble out">ok 👍<span class="time">9:42 pm ✓✓</span></div>
        <div class="bubble in">sound on?<span class="time">9:42 pm</span></div>
        <div class="bubble out">yes<span class="time">9:43 pm ✓✓</span></div>
    </div>

    <div class="stickers">
        <p>Stickers</p>
        <div class="sticker-grid">
            <label class="ad-option selected"><input type="radio" name="ad" value="0" checked><span><span class="emoji">🖼️</span><b>1</b><span>reddit gif</span></span></label>
            <label class="ad-option"><input type="radio" name="ad" value="1"><span><span class="emoji">🎬</span><b>2</b><span>video</span></span></label>
            <label class="ad-option"><input type="radio" name="ad" value="2"><span><span class="emoji">🎬</span><b>3</b><span>video</span></span></label>
            <label class="ad-option"><input type="radio" name="ad" value="3"><span><span class="emoji">🖼️</span><b>4</b><span>gif</span></span></label>
            <label class="ad-option"><input type="radio" name="ad" value="4"><span><span class="emoji">🖼️</span><b>5</b><span>gif</span></span></label>
            <label class="ad-option"><input type="radio" name="ad" value="5"><span><span class="emoji">🖼️</span><b>6</b><span>gif</span></span></label>
            <label class="ad-option"><input type="radio" name="ad" value="custom"><span><span class="emoji">🔗</span><b>Custom</b><span>link</span></span></label>
        </div>
    </div>

    <div class="input-bar">
        <div class="input-box">
            <span class="icon">😊</span>
            <input type="text" id="custom-url" placeholder="Message" autocomplete="off">
            <span class="icon">📷</span>
        </div>
        <button class="btn-push" id="push-btn" type="button" aria-label="Send">➤</button>
    </div>
    <div style="text-align:center;">
        <button class="btn-hide" id="hide-btn" type="button">↩&nbsp; Delete message</button>
    </div>

    <details>
        <summary>Settings</summary>
        <div class="details-body">
            <label for="worker-url">Server URL</label>
            <input type="text" id="worker-url" placeholder="https://…" autocomplete="off">
            <label for="room">Group code (must match the player)</label>
            <input type="text" id="room" value="main" autocomplete="off">
            <label for="pin">PIN (leave empty if none is set)</label>
            <input type="password" id="pin" placeholder="PIN" autocomplete="off">
            <button class="btn-save" id="connect-btn" type="button">Save</button>
            <p class="note">If the server is empty, this only works in another tab of this same browser.</p>
        </div>
    </details>
</div>

<script>
    const $ = (id) => document.getElementById(id);
    const statusEl = $('status');
    const params = new URLSearchParams(location.search);

    function getWorkerUrl() { return ($('worker-url').value || '').trim().replace(/\/$/, ''); }
    function getRoom() { return ($('room').value || 'main').trim(); }
    function getPin() { return $('pin').value || ''; }

    // Restore saved settings
    $('worker-url').value = params.get('worker') || localStorage.getItem('vpr_worker_url') || 'https://video-player-remote.sabbirahmeed.workers.dev';
    $('room').value = params.get('room') || localStorage.getItem('vpr_room') || 'main';
    $('pin').value = localStorage.getItem('vpr_pin') || '';

    function setStatus(text, kind) {
        statusEl.textContent = text;
        statusEl.className = 'status' + (kind ? ' ' + kind : '');
    }

    document.querySelectorAll('.ad-option').forEach((el) => {
        el.addEventListener('click', () => {
            document.querySelectorAll('.ad-option').forEach((o) => o.classList.remove('selected'));
            el.classList.add('selected');
        });
    });

    async function checkConnection() {
        const workerUrl = getWorkerUrl();
        const room = getRoom();
        localStorage.setItem('vpr_worker_url', workerUrl);
        localStorage.setItem('vpr_room', room);
        localStorage.setItem('vpr_pin', getPin());
        if (!workerUrl) {
            setStatus('offline — same phone only');
            return;
        }
        try {
            const res = await fetch(workerUrl + '/count?room=' + encodeURIComponent(room));
            const data = await res.json();
            setStatus('online' + (data.players != null ? ' • ' + data.players + ' here' : ''), 'ok');
        } catch {
            setStatus('offline', 'bad');
        }
    }

    function sendLocal(command) {
        try { new BroadcastChannel('video-player-remote-' + getRoom()).postMessage(command); } catch {}
        try { localStorage.setItem('video-player-remote-' + getRoom(), JSON.stringify(command)); } catch {}
    }

    async function sendCommand(command) {
        command.id = (crypto.randomUUID ? crypto.randomUUID() : String(Date.now()));
        command.room = getRoom();
        command.pin = getPin();
        const workerUrl = getWorkerUrl();
        if (!workerUrl) { sendLocal(command); return { ok: true, local: true }; }
        const res = await fetch(workerUrl + '/push', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(command),
        });
        const data = await res.json().catch(() => ({}));
        if (!res.ok) throw new Error(data.error || ('HTTP ' + res.status));
        return data;
    }

    function selectedAd() {
        const choice = document.querySelector('input[name="ad"]:checked').value;
        if (choice === 'custom') {
            const url = $('custom-url').value.trim();
            if (!url) throw new Error('Type a link in the message box first.');
            return { url };
        }
        return { index: parseInt(choice, 10) };
    }

    $('connect-btn').addEventListener('click', checkConnection);

    $('push-btn').addEventListener('click', async () => {
        const btn = $('push-btn');
        btn.disabled = true;
        try {
            const ad = selectedAd();
            await sendCommand({ type: 'show-floating-ad', ...ad });
            setStatus('Message sent', 'ok');
            setTimeout(checkConnection, 500);
        } catch (e) {
            setStatus('Message failed to send', 'bad');
        } finally { btn.disabled = false; }
    });

    $('hide-btn').addEventListener('click', async () => {
        try {
            await sendCommand({ type: 'hide-floating-ad' });
            setStatus('Message deleted', 'ok');
            setTimeout(checkConnection, 500);
        } catch (e) {
            setStatus('Delete failed', 'bad');
        }
    });

    checkConnection();
</script>
</body>
</html>
