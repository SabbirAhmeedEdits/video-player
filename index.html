<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>☠️ EXTREME HORROR MOVIES // Unrated 18+ Vault</title>
    
    <!-- Video.js CSS -->

    <!-- Google Fonts: Nosifer (Dripping Blood), Creepster, Share Tech Mono (Morgue Terminal), Cinzel -->

    <style>
        :root {
            --blood-pure: #ff002b;
            --blood-dark: #66000e;
            --blood-deep: #260005;
            --morgue-metal: #0d090b;
            --caution-yellow: #ffb703;
            --hazard-red: #d00000;
            --glow-red: 0 0 15px rgba(255, 0, 43, 0.7);
        }

        * {
            box-sizing: border-box;
        }

        body { 
            font-family: 'Inter', -apple-system, sans-serif; 
            padding: 20px 15px 60px; 
            background: #050204;
            background-image: 
                radial-gradient(circle at 50% 10%, #3d0208 0%, #150205 45%, #050204 100%),
                repeating-linear-gradient(0deg, rgba(0, 0, 0, 0.4) 0px, rgba(0, 0, 0, 0.4) 2px, transparent 2px, transparent 4px);
            color: #d1b8bc;
            min-height: 100vh;
            margin: 0;
            overflow-x: hidden;
        }

        /* Top Hazard Tape Ribbon */
        .hazard-caution-bar {
            width: 100%;
            height: 10px;
            background: repeating-linear-gradient(
                -45deg,
                #000,
                #000 15px,
                #9e0b16 15px,
                #9e0b16 30px
            );
            border-bottom: 1px solid var(--blood-pure);
            margin-bottom: 25px;
            box-shadow: 0 0 15px rgba(255, 0, 43, 0.5);
        }

        .container { 
            max-width: 980px; 
            margin: 0 auto; 
            position: relative;
            z-index: 2;
        }

        /* EXTREME HORROR HEADER */
        .horror-header {
            text-align: center;
            margin-bottom: 30px;
            position: relative;
        }

        .quarantine-tag {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: #1f0105;
            color: #ff334b;
            border: 1px solid #ff002b;
            font-family: 'Share Tech Mono', monospace;
            font-size: 11px;
            letter-spacing: 2px;
            padding: 6px 18px;
            border-radius: 2px;
            text-transform: uppercase;
            box-shadow: 0 0 20px rgba(255, 0, 43, 0.4), inset 0 0 8px rgba(255, 0, 43, 0.2);
            animation: pulse-border 2s infinite ease-in-out;
            margin-bottom: 12px;
        }

        @keyframes pulse-border {
            0%, 100% { border-color: #ff002b; box-shadow: 0 0 15px rgba(255, 0, 43, 0.4); }
            50% { border-color: #6b000d; box-shadow: 0 0 5px rgba(107, 0, 13, 0.2); }
        }

        /* Dripping Blood Main Title */
        .portal-title {
            font-family: 'Nosifer', cursive;
            font-size: clamp(22px, 5vw, 40px);
            color: #ff0a33;
            text-shadow: 0 0 15px #ff002b, 0 0 35px #990014, 0 0 60px #5e000c;
            margin: 10px 0 12px 0;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        .portal-subtitle {
            font-family: 'Share Tech Mono', monospace;
            font-size: 13px;
            color: #a87d84;
            letter-spacing: 2px;
            text-transform: uppercase;
            margin: 0;
        }

        /* Extreme 18+ Warning Banner */
        .extreme-warning-alert {
            background: linear-gradient(90deg, rgba(60, 0, 8, 0.95), rgba(130, 8, 20, 0.95), rgba(60, 0, 8, 0.95));
            border: 1.5px solid #ff1a35;
            border-radius: 6px;
            padding: 12px 18px;
            margin-bottom: 25px;
            display: flex;
            align-items: center;
            gap: 15px;
            box-shadow: 0 0 25px rgba(255, 0, 43, 0.35);
        }

        .warning-icon {
            font-size: 28px;
        }

        .warning-text {
            font-family: 'Share Tech Mono', monospace;
            font-size: 12px;
            color: #ffccd1;
            line-height: 1.5;
            letter-spacing: 0.5px;
        }

        .warning-text strong {
            color: #ffffff;
            font-weight: 900;
            text-decoration: underline;
        }

        /* Morgue Console Controls */
        .controls { 
            background: rgba(14, 6, 9, 0.92); 
            padding: 22px; 
            border-radius: 8px; 
            margin-bottom: 25px; 
            border: 1px solid #520f18;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.9), 0 0 25px rgba(200, 0, 30, 0.15); 
            position: relative;
        }

        .controls::before {
            content: "DEEP TERMINAL INPUT // ENCRYPTED STREAM";
            position: absolute;
            top: -10px;
            left: 20px;
            background: #140407;
            padding: 2px 10px;

            font-size: 10px;
            color: #ff334b;
            border: 1px solid #700f1c;

        .input-group {

            border-radius: 4px;

            font-size: 13px;
            outline: none;
            transition: all 0.3s ease;
        }

        input[type="text"]::placeholder {
            color: #573338;
        }

        input[type="text"]:focus {
            border-color: #ff002b;
            box-shadow: 0 0 18px rgba(255, 0, 43, 0.6);
            background: #0f0306;
        }

        button#load-url { 
            padding: 14px 28px; 
            cursor: pointer; 
            background: linear-gradient(135deg, #c9001e, #57000c); 
            color: #ffffff; 
            border: 1px solid #ff1a38; 
            border-radius: 4px; 
            font-family: 'Cinzel', serif;
            font-weight: 900; 
            letter-spacing: 1.5px;
            text-transform: uppercase;
            transition: all 0.3s ease;
            box-shadow: 0 0 20px rgba(200, 0, 30, 0.6);

        button#load-url:hover {
            background: linear-gradient(135deg, #ff052e, #850013);
            box-shadow: 0 0 35px rgba(255, 0, 43, 0.95);
            transform: scale(1.02);
        }

        /* File Upload */
        input[type="file"] {
            color: #8c6e73;
            font-family: 'Share Tech Mono', monospace;

        /* Centered Big Play Button */
        .video-js .vjs-big-play-button {

            line-height: 82px !important;
            top: 50% !important;
            left: 50% !important;

            color: #ffffff !important;
            transition: all 0.35s cubic-bezier(0.2, 0.8, 0.2, 1) !important;
            cursor: pointer !important;
        }

        .video-js .vjs-big-play-button::after {
            content: "";
            position: absolute;
            inset: -9px;
            border-radius: 50%;
            border: 2px solid rgba(255, 0, 43, 0.55);
            box-shadow: 0 0 25px rgba(255, 0, 43, 0.45);
            animation: button-aura 2.2s infinite ease-out;
            pointer-events: none;

            0% { transform: scale(0.96); opacity: 0.9; }

            100% { transform: scale(1.3); opacity: 0; }
        }

            font-size: 42px !important;
            line-height: 82px !important;
            color: #ffffff !important;
            text-shadow: 0 0 15px rgba(255, 0, 43, 0.9) !important;
            transition: all 0.3s ease !important;

        .video-js:hover .vjs-big-play-button,
        .video-js .vjs-big-play-button:hover {
            transform: translate(-50%, -50%) scale(1.12) !important;
            background: radial-gradient(circle at 40% 35%, #ff052e 0%, #780012 85%) !important;
            border-color: #ff4d66 !important;
            box-shadow: 0 0 50px rgba(255, 0, 43, 1), inset 0 0 25px rgba(255, 0, 43, 0.7), 0 20px 45px rgba(0, 0, 0, 1) !important;
        }

        /* Skip Button strictly hidden on homepage */
        .video-js .vjs-skip-button { 
            display: none !important;
            opacity: 0 !important;
            visibility: hidden !important;
            pointer-events: none !important;
            position: absolute; 
            bottom: 80px; 
            right: 25px; 
            background: rgba(25, 2, 5, 0.95); 
            color: #ff667a; 
            border: 1.5px solid #ff002b; 
            padding: 12px 26px; 
            cursor: pointer; 
            z-index: 11; 
            border-radius: 4px; 
            font-family: 'Cinzel', serif;
            font-weight: 900;
            letter-spacing: 2px;
            text-transform: uppercase;
            box-shadow: 0 0 25px rgba(255, 0, 43, 0.6);
            transition: opacity 0.3s ease, transform 0.3s ease;
        }

        .video-js .vjs-skip-button.is-active {
            display: flex !important;
            align-items: center;
            opacity: 1 !important;
            visibility: visible !important;
            pointer-events: auto !important;

        .video-js .vjs-skip-button:hover {

        /* Ad Banner */
        .vjs-ad-banner {

        .mixed-content-banner {

        .vjs-floating-ad {
            display: none;

        /* Video.js Control Bar Overrides */
        .vjs-theme-fantasy .vjs-control-bar {

        .vjs-theme-fantasy .vjs-play-progress { background-color: #ff002b !important; box-shadow: 0 0 15px #ff002b !important; }
        .vjs-theme-fantasy .vjs-slider { background-color: rgba(60, 10, 18, 0.8) !important; }
        .vjs-theme-fantasy .vjs-volume-level { background-color: #ff002b !important; }

        /* Movie Card Section */
        .archive-section { margin-top: 40px; }
        .archive-header {
            display: flex; align-items: center; justify-content: space-between;
            margin-bottom: 20px; border-bottom: 2px solid #ff002b; padding-bottom: 12px;
        }
        .archive-title {

            position: absolute; top: 10px; left: -32px; background: #d00000;

        .play-icon {

        }

        .movie-meta-tags { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 12px; }
        .tag-extreme { background: #ff002b; color: #ffffff; font-family: 'Share Tech Mono', monospace; font-size: 11px; font-weight: 900; padding: 4px 10px; border-radius: 3px; }
        .tag-biohazard { background: rgba(50, 5, 10, 0.85); color: #ff8090; border: 1px solid #9e1322; font-family: 'Share Tech Mono', monospace; font-size: 11px; padding: 4px 10px; border-radius: 3px; }

        .card-footer {

            border: 1px solid #ff4d
